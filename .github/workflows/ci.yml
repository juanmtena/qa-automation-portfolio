name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui-playwright } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: ui-playwright/playwright-report }

  selenium-cucumber:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui-selenium-cucumber } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cucumber-report, path: ui-selenium-cucumber/target/cucumber-report.html }

  api-karate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api-karate } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: karate-report, path: api-karate/target/karate-reports }

  ml-healthcare-qa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-healthcare-qa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ml-healthcare-qa/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -v
